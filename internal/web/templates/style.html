{{define "style.html"}}<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fdf8e4; color: #23301f;
  }
  main { max-width: 780px; margin: 0 auto; }
  main.narrow { max-width: 420px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
  .sub { color: #5c6b57; margin: 4px 0 16px; }
  section { background: #fff; border-radius: 12px; padding: 18px; margin: 0 0 18px; }
  .count { font-size: 1.25rem; margin: 0 0 18px; }
  .count strong { font-size: 1.8rem; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: .93rem; }
  input, textarea {
    width: 100%; padding: 11px 13px; font: inherit;
    border: 1px solid #cfd6cb; border-radius: 8px; background: #fff; color: inherit;
  }
  button {
    margin-top: 14px; padding: 11px 20px; font: inherit; font-weight: 600;
    color: #fff; background: #2f8f5b; border: 0; border-radius: 999px; cursor: pointer;
  }
  button:hover { background: #27794d; }
  button.quiet {
    margin: 0; padding: 5px 10px; font-weight: 400; font-size: .88rem;
    color: #5c6b57; background: transparent; border: 1px solid #cfd6cb; border-radius: 6px;
  }
  button.quiet:hover { background: #f0f3ee; }
  .quiet-link { font-size: .88rem; font-weight: 400; color: #2f8f5b; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #7b8a76; padding: 0 0 6px; }
  td { padding: 9px 0; border-top: 1px solid #eef1ec; vertical-align: middle; }
  td:last-child { text-align: right; width: 1%; white-space: nowrap; }
  .when { color: #7b8a76; font-size: .88rem; white-space: nowrap; }
  tr.gone td { color: #9aa895; }
  tr.dup td { background: #fffbe8; }
  .tag { font-size: .72rem; background: #f5e6a8; color: #6b5a10; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .notice { background: #e3f2e6; border-left: 4px solid #2f8f5b; padding: 11px 14px; border-radius: 6px; margin: 0 0 16px; }
  .problem { background: #fbe6e6; border-left: 4px solid #a33; padding: 11px 14px; border-radius: 6px; margin: 0 0 16px; }
  .danger { border: 1px solid #f0d9d9; }
  .danger-btn { background: #a33; }
  .danger-btn:hover { background: #8a2a2a; }
  details { margin-top: 22px; }
  summary { cursor: pointer; color: #5c6b57; font-size: .93rem; }
  form.stack { margin: 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #1b201a; color: #e8ece6; }
    section { background: #242a22; }
    input, textarea { background: #1b201a; border-color: #3c453a; color: inherit; }
    .sub, .when, th { color: #9aa895; }
    td { border-color: #323a30; }
    tr.dup td { background: #2e2a1c; }
    .notice { background: #1e3325; }
    .problem { background: #33201f; }
    button.quiet { color: #c3cbbe; border-color: #3c453a; }
    button.quiet:hover { background: #2c332a; }
  }
</style>{{end}}
